<body>

<div class="card-form card shadow p-4">
    <h5 class="mb-4">➕ Nova Transação</h5>

    {% if erro %}
    <div class="alert alert-danger">{{ erro }}</div>
    {% endif %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <input type="text" name="descricao" class="form-control" placeholder="Ex: Almoço, Salário..." required>
        </div>
        <div class="mb-3">
            <label class="form-label">Valor (R$)</label>
            <input type="number" name="valor" step="0.01" class="form-control" placeholder="0.00" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Tipo</label>
            <select name="tipo" class="form-select" required>
                <option value="receita">Receita</option>
                <option value="despesa">Despesa</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Categoria</label>
            <select name="categoria" class="form-select" required>
                <option value="Alimentação">Alimentação</option>
                <option value="Transporte">Transporte</option>
                <option value="Saúde">Saúde</option>
                <option value="Lazer">Lazer</option>
                <option value="Educação">Educação</option>
                <option value="Moradia">Moradia</option>
                <option value="Salário">Salário</option>
                <option value="Outros">Outros</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Salvar</button>
    </form>

    <hr>
    <a href="/" class="btn btn-outline-secondary w-100">Voltar</a>
</div>

</body>
