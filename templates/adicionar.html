<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo — Nova Transação</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="form-page">
    <div class="form-card">
        <div class="form-logo">
            <div class="logo-dot"></div>
            Nova Transação
        </div>
        <div class="form-sub">Registre uma receita ou despesa</div>

        {% if erro %}
        <div class="alert-erro">{{ erro }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label class="form-label">Descrição</label>
                <input type="text" name="descricao" class="form-input" placeholder="Ex: Almoço, Salário..." required>
            </div>
            <div class="form-group">
                <label class="form-label">Valor (R$)</label>
                <input type="number" name="valor" step="0.01" class="form-input" placeholder="0.00" required>
            </div>
            <div class="form-group">
                <label class="form-label">Tipo</label>
                <select name="tipo" class="form-select" required>
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Categoria</label>
                <select name="categoria" class="form-select" required>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Saúde">Saúde</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Educação">Educação</option>
                    <option value="Moradia">Moradia</option>
                    <option value="Salário">Salário</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Data</label>
                <input type="date" name="data" class="form-input" value="{{ hoje }}" required>
            </div>
            <button type="submit" class="form-btn">Salvar</button>
        </form>

        <div class="form-link">
            <a href="/">← Voltar ao dashboard</a>
        </div>
    </div>
</div>

</body>
</html>
