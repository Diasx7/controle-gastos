<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Transação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .card-form { max-width: 500px; margin: 80px auto; }
    </style>
</head>
<body>

<div class="card-form card shadow p-4">
    <h5 class="mb-4">✏️ Editar Transação</h5>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <input type="text" name="descricao" class="form-control" value="{{ transacao.descricao }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Valor (R$)</label>
            <input type="number" name="valor" step="0.01" class="form-control" value="{{ transacao.valor }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Tipo</label>
            <select name="tipo" class="form-select" required>
                <option value="receita" {% if transacao.tipo == "receita" %}selected{% endif %}>Receita</option>
                <option value="despesa" {% if transacao.tipo == "despesa" %}selected{% endif %}>Despesa</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Categoria</label>
            <select name="categoria" class="form-select" required>
                <option value="Alimentação" {% if transacao.categoria == "Alimentação" %}selected{% endif %}>Alimentação</option>
                <option value="Transporte" {% if transacao.categoria == "Transporte" %}selected{% endif %}>Transporte</option>
                <option value="Saúde" {% if transacao.categoria == "Saúde" %}selected{% endif %}>Saúde</option>
                <option value="Lazer" {% if transacao.categoria == "Lazer" %}selected{% endif %}>Lazer</option>
                <option value="Educação" {% if transacao.categoria == "Educação" %}selected{% endif %}>Educação</option>
                <option value="Moradia" {% if transacao.categoria == "Moradia" %}selected{% endif %}>Moradia</option>
                <option value="Salário" {% if transacao.categoria == "Salário" %}selected{% endif %}>Salário</option>
                <option value="Outros" {% if transacao.categoria == "Outros" %}selected{% endif %}>Outros</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Data</label>
            <input type="date" name="data" class="form-control" value="{{ transacao.data.strftime('%Y-%m-%d') }}" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Salvar alterações</button>
    </form>

    <hr>
    <a href="/" class="btn btn-outline-secondary w-100">Voltar</a>
</div>

</body>
</html>
