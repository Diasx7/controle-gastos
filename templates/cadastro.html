<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
        }
        .card-cadastro {
            max-width: 420px;
            margin: 80px auto;
        }
    </style>
</head>
<body>

<div class="card-cadastro card shadow p-4">
    <h4 class="mb-1">💰 Controle de Gastos</h4>
    <p class="text-muted mb-4">Crie sua conta</p>

    {% if erro %}
    <div class="alert alert-danger">{{ erro }}</div>
    {% endif %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nome completo</label>
            <input type="text" name="nome" class="form-control" placeholder="Seu nome" required>
        </div>
        <div class="mb-3">
            <label class="form-label">CPF</label>
            <input type="text" name="cpf" class="form-control" placeholder="000.000.000-00" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="senha" class="form-control" placeholder="Crie uma senha" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Cadastrar</button>
    </form>

    <hr>
    <p class="text-center mb-0">Já tem conta? <a href="/login">Entrar</a></p>
</div>

</body>
</html>
