<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo — Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="form-page">
    <div class="form-card">
        <div class="form-logo">
            <div class="logo-dot"></div>
            Fluxo
        </div>
        <div class="form-sub">Entre na sua conta</div>

        {% if erro %}
        <div class="alert-erro">{{ erro }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label class="form-label">CPF</label>
                <input type="text" name="cpf" class="form-input" placeholder="000.000.000-00" required>
            </div>
            <div class="form-group">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-input" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="form-btn">Entrar</button>
        </form>

        <div class="form-link">
            Não tem conta? <a href="/cadastro">Cadastre-se</a>
        </div>
    </div>
</div>

</body>
</html>
